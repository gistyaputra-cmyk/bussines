<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Shop 💖</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #ffc0cb, #ffb6c1);
        margin: 0;
        padding: 0;
    }

    .container {
        text-align: center;
        padding: 50px;
    }

    input {
        padding: 10px;
        margin: 10px;
        border-radius: 10px;
        border: none;
        width: 200px;
    }

    button {
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background-color: hotpink;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: deeppink;
    }

    .hidden {
        display: none;
    }

    .product {
        background: white;
        margin: 10px;
        padding: 15px;
        border-radius: 15px;
        display: inline-block;
        width: 150px;
        cursor: pointer;
    }

    .logout {
        position: absolute;
        top: 10px;
        right: 10px;
        background: red;
        font-size: 12px;
    }

    .popup {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .popup-content {
        background: white;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
    }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container">
    <h2>Login Admin 💖</h2>
    <input type="text" id="username" placeholder="Username"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Masuk 🚀</button>
    <p id="error" style="color:red;"></p>
</div>

<!-- HALAMAN PRODUK -->
<div id="productPage" class="container hidden">
    <button class="logout" onclick="logout()">Logout 🚪</button>
    <h2>Produk Digital Imut 💕</h2>

    <div class="product" onclick="buy('Ebook Bisnis 💼')">Ebook 💼</div>
    <div class="product" onclick="buy('Template Canva 🎨')">Canva 🎨</div>
    <div class="product" onclick="buy('Preset Lightroom 📸')">Preset 📸</div>
    <div class="product" onclick="buy('Script Bot 🤖')">Bot 🤖</div>
    <div class="product" onclick="buy('Desain Logo 🖌️')">Logo 🖌️</div>
    <div class="product" onclick="buy('Video Editing Pack 🎬')">Video 🎬</div>

</div>

<!-- POPUP -->
<div id="popup" class="popup hidden">
    <div class="popup-content">
        <h3 id="productName"></h3>
        <p>Rek: 085708829924 💳</p>
        <p>Kirim bukti pembayaran ya 💖</p>
        <button onclick="confirmBuy()">Beli 💸</button>
        <button onclick="closePopup()">Cancel ❌</button>
    </div>
</div>

<script>
    function login() {
        let user = document.getElementById("username").value;
        let pass = document.getElementById("password").value;

        if (user === "admin" && pass === "1234") {
            document.getElementById("loginPage").classList.add("hidden");
            document.getElementById("productPage").classList.remove("hidden");
        } else {
            document.getElementById("error").innerText = "Login gagal 😢";
        }
    }

    function logout() {
        document.getElementById("productPage").classList.add("hidden");
        document.getElementById("loginPage").classList.remove("hidden");
    }

    function buy(product) {
        document.getElementById("popup").classList.remove("hidden");
        document.getElementById("productName").innerText = product;
    }

    function closePopup() {
        document.getElementById("popup").classList.add("hidden");
    }

    function confirmBuy() {
        alert("Pembelian sukses 🎉💖");
        closePopup();
    }
</script>

</body>
</html>
